# 啟用滑鼠/觸控支援
set -g mouse on

# 關閉 aggressive-resize (iTerm2 -CC 必要條件)
setw -g aggressive-resize off

# 視窗大小策略：以最大客戶端為準
# 避免 Termius 連入時縮小 iTerm2 視窗
set-option -g window-size largest

# 增加歷史紀錄
set-option -g history-limit 50000

# 256 色 + True Color 支援
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -s set-clipboard on

# 允許 OSC 序列透傳到終端機（Ghostty 桌面通知需要）
set -g allow-passthrough on

# 關閉視窗時直接 kill session，不 detach
set-option -g destroy-unattached on

# 標題設定 (讓 ShellFish 能識別 session)
set -g set-titles on
set -g set-titles-string "#S - #W"
